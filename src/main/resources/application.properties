spring.application.name=calorizer

server.port=8081

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:54320/calorizer}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

app.jwt.secret=9a4f2c8d3e1b7f6a5c4d3b2a1e0f9c8b7a6e5d4c3b2a1f0e9d8c7b6a5f4e3d2c
app.jwt.access-expiration-ms: 900000
app.jwt.refresh-expiration-ms: 604800000

management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers
management.endpoint.health.show-details=always
management.metrics.tags.application=MyApplication

logging.level.root=INFO
logging.level.org.springframework.security=DEBUG



